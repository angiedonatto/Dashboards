name: ChatGPT option A compliance redesign

on:
  push:
    branches:
      - chatgpt/status-thermometer

permissions:
  contents: write

jobs:
  patch-and-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/status-thermometer

      - name: Apply option A design
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          new_css = r'''.status-thermo-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.status-thermo-card{position:relative;border:1px solid #d8e3f2;background:#fff;border-radius:14px;padding:14px 15px;min-width:0}.status-thermo-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}.status-thermo-title{font-size:12.5px;font-weight:850;color:#17233e}.status-thermo-total{font-size:10.5px;color:#71819e;font-weight:760;white-space:nowrap}.status-thermo-body{display:grid;grid-template-columns:78px minmax(0,1fr);gap:14px;align-items:center}.status-thermo-axis{display:grid;grid-template-columns:28px 38px;gap:9px;align-items:stretch;height:166px}.status-thermo-scale{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;font-size:9.5px;color:#7d8ca5;font-weight:700;padding:1px 0}.status-thermo-track{height:166px;border:1px solid #cbd8e9;border-radius:13px;overflow:hidden;background:#edf2f8;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}.status-thermo-seg{appearance:none;border:0;margin:0;padding:0;width:100%;display:block;cursor:pointer;transition:filter .16s ease,transform .16s ease,box-shadow .16s ease;outline:none}.status-thermo-seg:hover,.status-thermo-seg:focus-visible{filter:saturate(1.08) brightness(1.025);transform:scaleX(1.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}.status-thermo-seg.pending-rem{background:#f2a13a}.status-thermo-seg.pending-man{background:#ef6671}.status-thermo-seg.done{background:#1cae7a}.status-thermo-copy{min-width:0}.status-thermo-main{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}.status-thermo-pct{font-size:23px;line-height:1;font-weight:880;letter-spacing:-.035em;color:#159a6c}.status-thermo-label{font-size:10.5px;font-weight:760;color:#657895}.status-thermo-pending{font-size:10.5px;font-weight:820;margin-bottom:12px}.status-thermo-pending.rem{color:#c77812}.status-thermo-pending.man{color:#d94a57}.status-summary-list{display:grid;gap:7px}.status-summary-row{appearance:none;width:100%;border:1px solid #dce6f4;background:#fff;border-radius:10px;padding:0;display:grid;grid-template-columns:5px minmax(0,1fr) auto 14px;align-items:center;min-height:39px;overflow:hidden;text-align:left;color:inherit;transition:border-color .16s ease,background .16s ease,box-shadow .16s ease,transform .16s ease}.status-summary-row.od-clickable{cursor:pointer}.status-summary-row:hover{border-color:#c5d4e9;background:#fbfdff}.status-summary-accent{height:100%;width:5px;background:var(--accent)}.status-summary-label{padding-left:10px;font-size:10.5px;color:#5f708d;font-weight:780}.status-summary-value{font-size:13px;color:#17233e;font-weight:880;letter-spacing:-.015em}.status-summary-chevron{font-size:18px;line-height:1;color:#8ca0bd;font-weight:500;padding-right:7px}.status-summary-row.is-active{border-color:#9eb7e7;background:#f7faff;box-shadow:inset 0 0 0 1px rgba(35,67,164,.06)}.status-summary-row.is-related{border-color:var(--accent);background:#fbfdff;box-shadow:0 5px 14px rgba(31,57,105,.08);transform:translateX(2px)}.status-hover-tip{position:absolute;z-index:10;left:137px;top:88px;min-width:158px;max-width:210px;padding:9px 10px;background:#fff;border:1px solid #cfdced;border-radius:10px;box-shadow:0 12px 28px rgba(27,53,127,.16);opacity:0;transform:translateY(5px);pointer-events:none;transition:opacity .14s ease,transform .14s ease}.status-hover-tip.is-visible{opacity:1;transform:translateY(0)}.status-hover-tip::before{content:"";position:absolute;left:-6px;top:18px;width:10px;height:10px;background:#fff;border-left:1px solid #cfdced;border-bottom:1px solid #cfdced;transform:rotate(45deg)}.status-hover-tip-title{font-size:10.5px;font-weight:850;color:#17233e;margin-bottom:3px}.status-hover-tip-meta{font-size:9.8px;font-weight:720;color:#657895;line-height:1.25}.status-panel-sub{font-size:10.5px;color:#71819e;margin:-4px 0 12px}.text-purple{color:var(--violet)}.text-orange{color:var(--orange)}.text-green{color:var(--green)}.text-red{color:var(--red)}
#statusPanel{padding:14px 16px 15px}#statusPanel h3{font-size:13px;margin-bottom:8px;color:#17233e}
@media(max-width:900px){.status-thermo-wrap{grid-template-columns:1fr}.status-thermo-body{grid-template-columns:70px minmax(0,1fr)}.status-hover-tip{left:126px}}'''

          css_pattern = re.compile(r"\.status-thermo-wrap\{.*?@media\(max-width:900px\)\{\.status-thermo-wrap\{grid-template-columns:1fr\}\.status-thermo-body\{grid-template-columns:[^}]+\}\}", re.S)
          text, css_count = css_pattern.subn(new_css, text, count=1)
          if css_count != 1:
              raise SystemExit(f'Expected one thermometer CSS block, found {css_count}')

          new_js = r'''function renderStatus(){var a=rows(false),m=countBy(a,'status'),d=m.Cumplido||0,p=m.Pendiente||0,t=d+p,active=$('filterState').value,md={},mp={};a.forEach(function(x){if(x.status==='Cumplido')md[x.manifest]=1;if(x.status==='Pendiente')mp[x.manifest]=1});var manDone=Object.keys(md).length,manPend=Object.keys(mp).length,manTotal=manDone+manPend,remDonePct=pct(d,t),remPendPct=pct(p,t),manDonePct=pct(manDone,manTotal),manPendPct=pct(manPend,manTotal);var statusHeadline,statusSub;if(!t){statusHeadline='Sin remesas en este filtro';statusSub='Ajusta los filtros para ver el cumplimiento'}else if(!p){statusHeadline='Todo al día';statusSub='100% de cumplimiento'}else{statusHeadline=p+(p===1?' remesa por cumplir':' remesas por cumplir');statusSub=remPendPct+'% del total · '+manPend+(manPend===1?' manifiesto pendiente':' manifiestos pendientes')};$('statusTitle').textContent=statusHeadline;$('statusContent').innerHTML='<div class="status-panel-sub">'+statusSub+'</div><div class="status-thermo-wrap"><section class="status-thermo-card"><div class="status-hover-tip"><div class="status-hover-tip-title"></div><div class="status-hover-tip-meta"></div></div><div class="status-thermo-head"><div class="status-thermo-title">Remesas</div><div class="status-thermo-total">'+t+' total</div></div><div class="status-thermo-body"><div class="status-thermo-axis"><div class="status-thermo-scale"><span>100%</span><span>0%</span></div><div class="status-thermo-track"><button type="button" class="status-thermo-seg pending-rem" style="height:'+remPendPct+'%" data-hover-key="pending" data-tip-title="Por cumplir" data-tip-meta="'+p+' remesas · '+remPendPct+'%" data-st="Pendiente" aria-label="Por cumplir: '+p+' remesas, '+remPendPct+'%"></button><button type="button" class="status-thermo-seg done" style="height:'+remDonePct+'%" data-hover-key="done" data-tip-title="Cumplidas" data-tip-meta="'+d+' remesas · '+remDonePct+'%" data-st="Cumplido" aria-label="Cumplidas: '+d+' remesas, '+remDonePct+'%"></button></div></div><div class="status-thermo-copy"><div class="status-thermo-main"><span class="status-thermo-pct">'+remDonePct+'%</span><span class="status-thermo-label">cumplidas</span></div><div class="status-thermo-pending rem">'+remPendPct+'% por cumplir</div><div class="status-summary-list"><button type="button" class="status-summary-row od-clickable '+(active==='Cumplido'?'is-active':'')+'" style="--accent:#1cae7a" data-summary-key="done" data-st="Cumplido"><span class="status-summary-accent"></span><span class="status-summary-label">Cumplidas</span><strong class="status-summary-value">'+d+'</strong><span class="status-summary-chevron">›</span></button><button type="button" class="status-summary-row od-clickable '+(active==='Pendiente'?'is-active':'')+'" style="--accent:#f2a13a" data-summary-key="pending" data-st="Pendiente"><span class="status-summary-accent"></span><span class="status-summary-label">Por cumplir</span><strong class="status-summary-value">'+p+'</strong><span class="status-summary-chevron">›</span></button></div></div></div></section><section class="status-thermo-card"><div class="status-hover-tip"><div class="status-hover-tip-title"></div><div class="status-hover-tip-meta"></div></div><div class="status-thermo-head"><div class="status-thermo-title">Manifiestos</div><div class="status-thermo-total">'+manTotal+' total</div></div><div class="status-thermo-body"><div class="status-thermo-axis"><div class="status-thermo-scale"><span>100%</span><span>0%</span></div><div class="status-thermo-track"><button type="button" class="status-thermo-seg pending-man" style="height:'+manPendPct+'%" data-hover-key="pending" data-tip-title="Por cumplir" data-tip-meta="'+manPend+' manifiestos · '+manPendPct+'%" aria-label="Por cumplir: '+manPend+' manifiestos, '+manPendPct+'%"></button><button type="button" class="status-thermo-seg done" style="height:'+manDonePct+'%" data-hover-key="done" data-tip-title="Cumplidos" data-tip-meta="'+manDone+' manifiestos · '+manDonePct+'%" aria-label="Cumplidos: '+manDone+' manifiestos, '+manDonePct+'%"></button></div></div><div class="status-thermo-copy"><div class="status-thermo-main"><span class="status-thermo-pct">'+manDonePct+'%</span><span class="status-thermo-label">cumplidos</span></div><div class="status-thermo-pending man">'+manPendPct+'% por cumplir</div><div class="status-summary-list"><div class="status-summary-row" style="--accent:#1cae7a" data-summary-key="done"><span class="status-summary-accent"></span><span class="status-summary-label">Cumplidos</span><strong class="status-summary-value">'+manDone+'</strong><span class="status-summary-chevron">›</span></div><div class="status-summary-row" style="--accent:#ef6671" data-summary-key="pending"><span class="status-summary-accent"></span><span class="status-summary-label">Por cumplir</span><strong class="status-summary-value">'+manPend+'</strong><span class="status-summary-chevron">›</span></div></div></div></div></section></div>';Array.from($('statusContent').querySelectorAll('[data-st]')).forEach(function(b){b.addEventListener('click',function(){var s=this.dataset.st;$('filterState').value=$('filterState').value===s?'':s;if(s!=='Pendiente')state.aging='';renderAll()})});Array.from($('statusContent').querySelectorAll('.status-thermo-seg')).forEach(function(seg){var show=function(){var card=seg.closest('.status-thermo-card'),tip=card.querySelector('.status-hover-tip'),row=card.querySelector('[data-summary-key="'+seg.dataset.hoverKey+'"]');tip.querySelector('.status-hover-tip-title').textContent=seg.dataset.tipTitle;tip.querySelector('.status-hover-tip-meta').textContent=seg.dataset.tipMeta;tip.classList.add('is-visible');if(row)row.classList.add('is-related')},hide=function(){var card=seg.closest('.status-thermo-card'),tip=card.querySelector('.status-hover-tip'),row=card.querySelector('[data-summary-key="'+seg.dataset.hoverKey+'"]');tip.classList.remove('is-visible');if(row)row.classList.remove('is-related')};seg.addEventListener('mouseenter',show);seg.addEventListener('mouseleave',hide);seg.addEventListener('focus',show);seg.addEventListener('blur',hide)})}
var ac='''

          js_pattern = re.compile(r"function renderStatus\(\)\{.*?\}\nvar ac=", re.S)
          text, js_count = js_pattern.subn(new_js, text, count=1)
          if js_count != 1:
              raise SystemExit(f'Expected one renderStatus function, found {js_count}')

          path.write_text(text, encoding='utf-8')
          print('Option A applied')
          PY

      - name: Commit option A implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Polish compliance thermometers with interactive summary rows"
            git push origin HEAD:chatgpt/status-thermometer
          fi

      - name: Capture actual dashboard preview
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/dashboard-http.log 2>&1 &
          sleep 2
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,1800 --screenshot=dashboard-option-a.png http://127.0.0.1:4173/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-option-a-preview
          path: dashboard-option-a.png
          retention-days: 1
