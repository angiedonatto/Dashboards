name: ChatGPT add span 9 support

on:
  push:
    branches:
      - chatgpt/status-thermometer

permissions:
  contents: write

jobs:
  patch-and-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/status-thermometer
      - name: Add span 9 grid utility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.span-3{grid-column:span 3}'
          new='.span-12{grid-column:span 12}.span-9{grid-column:span 9}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.span-3{grid-column:span 3}'
          if old not in s:
              raise SystemExit('grid span utilities target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Capture actual dashboard
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/dashboard-http.log 2>&1 &
          sleep 2
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,1800 --screenshot=dashboard-wide-fixed.png http://127.0.0.1:4173/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-wide-fixed-preview
          path: dashboard-wide-fixed.png
          retention-days: 1
      - name: Commit grid utility fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Support wider nine-column compliance panel"
          git push origin HEAD:chatgpt/status-thermometer
