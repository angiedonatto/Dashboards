name: ChatGPT option A run

on:
  push:
    branches:
      - chatgpt/status-thermometer

permissions:
  contents: write

jobs:
  apply-option-a:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/status-thermometer

      - name: Apply option A patch
        run: python tools/patch_option_a.py

      - name: Capture actual dashboard
        run: |
          python3 -m http.server 4173 >/tmp/dashboard-http.log 2>&1 &
          sleep 2
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,1800 --screenshot=dashboard-option-a.png http://127.0.0.1:4173/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-option-a-preview
          path: dashboard-option-a.png
          retention-days: 1

      - name: Commit option A implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/patch_option_a.py .github/workflows/chatgpt-option-a-run.yml
          git add index.html tools/patch_option_a.py .github/workflows/chatgpt-option-a-run.yml
          git commit -m "Polish compliance thermometers with option A interactions"
          git push origin HEAD:chatgpt/status-thermometer
